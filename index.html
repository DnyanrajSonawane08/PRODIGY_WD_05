<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2 class="logo">☁️ WeatherApp</h2>

    <div class="search-box">
        <input type="text" id="city" placeholder="Search city...">
        <button onclick="getWeather()">Search</button>
    </div>

    <!-- Weather Card -->
    <div class="weather-card">
        <div>
            <h1 class="city-name" id="cityName">City</h1>
            <p id="condition">Condition</p>
            <h2 class="temp" id="temp">--°</h2>
        </div>

        <div class="stats">
            <p>🌬 Wind: <span id="wind">--</span></p>
            <p>💧 Humidity: <span id="humidity">--</span></p>
            <p>🌡 Feels Like: <span id="feels">--</span></p>
        </div>
    </div>

</div>
<script>
const apiKey = "15803e84296447b88bf51619263101";

function getWeather(){
    let city = document.getElementById("city").value;

    if(!city){
        alert("Enter city name");
        return;
    }

    fetch(`https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}&aqi=no`)
    .then(res => res.json())
    .then(data => {

        if(data.error){
            alert(data.error.message);
            return;
        }

        document.getElementById("cityName").innerText = data.location.name;
        document.getElementById("condition").innerText = data.current.condition.text;
        document.getElementById("temp").innerText = Math.round(data.current.temp_c) + "°";
        document.getElementById("wind").innerText = data.current.wind_kph + " km/h";
        document.getElementById("humidity").innerText = data.current.humidity + "%";
        document.getElementById("feels").innerText = Math.round(data.current.feelslike_c) + "°";
    })
    .catch(err => {
        alert("Error fetching weather");
        console.log(err);
    });
}
</script>

</body>
</html>
